<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://msgqzgzoslearaprgiqq.supabase.co https://api.emailjs.com wss://msgqzgzoslearaprgiqq.supabase.co; font-src 'self' data:; base-uri 'self'; form-action 'self'" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <title>إنشاء حساب - بوابة الشريك</title>
  <link rel="stylesheet" href="../assets/css/app.css?v=20260712-1" />
</head>
<body data-page="signup">
  <main class="auth-shell">
    <section class="auth-card">
      <a class="auth-brand" href="../index.html">Buda Partner Portal</a>
      <h1 class="auth-title">إنشاء حساب جديد</h1>
      <p class="auth-subtitle">أنشئ حسابك ثم فعّل البريد بكود OTP للمتابعة.</p>
      <p id="auth-status" class="status-note hidden" aria-live="polite"></p>
      <form id="signupForm" class="portal-form" novalidate>
        <div class="field-grid">
          <div class="field">
            <label for="signupName">الاسم بالكامل</label>
            <input id="signupName" type="text" required autocomplete="name" />
          </div>
          <div class="field">
            <label for="signupPhone">رقم الهاتف</label>
            <input id="signupPhone" type="tel" required autocomplete="tel" inputmode="tel" />
          </div>
        </div>
        <div class="field">
          <label for="signupEmail">البريد الإلكتروني</label>
          <input id="signupEmail" type="email" autocomplete="email" required inputmode="email" />
        </div>
        <div class="field-grid">
          <div class="field">
            <label for="signupPassword">كلمة المرور</label>
            <input id="signupPassword" type="password" minlength="8" autocomplete="new-password" required />
          </div>
          <div class="field">
            <label for="signupConfirm">تأكيد كلمة المرور</label>
            <input id="signupConfirm" type="password" minlength="8" autocomplete="new-password" required />
          </div>
        </div>
        <button type="submit" class="btn-primary">إنشاء الحساب</button>
      </form>
      <button type="button" class="btn-google" onclick="startGoogleOAuth()" style="width:100%;margin-top:12px;min-height:44px;border:1px solid #d9e2ec;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;font-size:0.9rem;font-weight:700;color:#334155;font-family:inherit;" onmouseover="this.style.background='#f7f8fb'" onmouseout="this.style.background='#fff'">
        <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.28-3.14.76-4.59l-7.98-6.19A23.99 23.99 0 0 0 0 24c0 3.77.87 7.35 2.56 10.56l7.97-5.97z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 5.97C6.51 42.62 14.48 48 24 48z"/></svg>
        <span>Google</span>
      </button>
      <div class="auth-links">
        <span>لديك حساب بالفعل؟</span>
        <a href="login.html">تسجيل الدخول</a>
      </div>
    </section>
  </main>
  <script src="../js/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="../assets/js/config.js?v=20260326-1"></script>
  <script src="../assets/js/security-utils.js?v=20260324-4"></script>
  <script src="../assets/js/supabase-service.js?v=20260712-2"></script>
  <script src="../assets/js/session.js?v=20260326-1"></script>
  <script src="../assets/js/auth.js?v=20260405-1"></script>
</body>
</html>
