<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https: blob:; media-src 'self' https: blob:; connect-src 'self' https://msgqzgzoslearaprgiqq.supabase.co https://api.emailjs.com wss://msgqzgzoslearaprgiqq.supabase.co; font-src 'self' data: https://cdnjs.cloudflare.com; base-uri 'self'; form-action 'self'" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <title>إضافة منتج - بوابة الشريك</title>
  <link rel="icon" href="data:," />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .pe-hero {
      background: linear-gradient(135deg, #0e7c66 0%, #0a5f4e 60%, #064a3d 100%);
      border-radius: 20px; padding: 28px 24px; color: #fff; text-align: center;
      box-shadow: 0 8px 32px rgba(14,124,102,0.25); margin-bottom: 20px;
      position: relative; overflow: hidden;
    }
    .pe-hero::before {
      content: ''; position: absolute; width: 200px; height: 200px;
      background: rgba(255,255,255,0.05); border-radius: 50%;
      top: -60px; left: -60px;
    }
    .pe-hero .hero-icon { font-size: 2.2rem; margin-bottom: 6px; display: block; }
    .pe-hero h1 { font-size: 1.5rem; font-weight: 800; margin: 0 0 4px; }
    .pe-hero p { opacity: 0.8; font-size: 0.9rem; margin: 0; }

    .pe-card {
      background: #fff; border-radius: 20px; padding: 24px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.05); margin-bottom: 16px;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .pe-card .card-title {
      font-size: 1rem; font-weight: 800; margin: 0 0 16px;
      display: flex; align-items: center; gap: 8px; color: #1a2332;
    }
    .pe-card .card-title i { color: #0e7c66; }

    .pe-field { margin-bottom: 18px; }
    .pe-field label {
      display: block; font-weight: 700; font-size: 0.82rem;
      color: #4a5568; margin-bottom: 6px;
    }
    .pe-field .pe-input {
      width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0;
      border-radius: 12px; font-size: 0.95rem; transition: all 0.2s;
      background: #f8fafc; font-family: inherit;
    }
    .pe-field .pe-input:focus {
      border-color: #0e7c66; box-shadow: 0 0 0 3px rgba(14,124,102,0.1);
      outline: none; background: #fff;
    }
    .pe-field textarea.pe-input { resize: vertical; min-height: 80px; }

    .pe-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 500px) { .pe-grid { grid-template-columns: 1fr; } }

    .pe-upload-zone {
      border: 2px dashed #cbd5e1; border-radius: 16px; padding: 24px 16px;
      text-align: center; cursor: pointer; transition: all 0.2s;
      background: #f8fafc;
    }
    .pe-upload-zone:hover { border-color: #0e7c66; background: #f0fdf6; }
    .pe-upload-zone .uz-icon { font-size: 2rem; color: #0e7c66; margin-bottom: 6px; }
    .pe-upload-zone .uz-title { font-weight: 700; color: #1e293b; margin: 0 0 2px; }
    .pe-upload-zone .uz-hint { font-size: 0.78rem; color: #94a3b8; }

    .pe-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
    .btn-pe {
      padding: 12px 32px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, #0e7c66, #0a5f4e);
      color: #fff; font-size: 0.95rem; font-weight: 800; cursor: pointer;
      transition: all 0.25s; box-shadow: 0 4px 16px rgba(14,124,102,0.25);
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-pe:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(14,124,102,0.35); }
    .btn-pe:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-pe-secondary {
      padding: 12px 24px; border-radius: 14px; font-size: 0.9rem; font-weight: 700;
      border: 2px solid #0e7c66; color: #0e7c66; background: transparent;
      cursor: pointer; transition: all 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-pe-secondary:hover { background: #0e7c66; color: #fff; }
  </style>
</head>
<body data-page="product-editor">
  <header class="topbar">
    <div class="topbar-inner">
      <strong class="brand-title">Buda Partner Portal</strong>
      <div class="topbar-actions">
        <div id="userMenuRoot" class="user-menu">
          <button id="userMenuTrigger" class="avatar-trigger" type="button" aria-label="قائمة المستخدم" aria-haspopup="menu" aria-expanded="false" aria-controls="userMenuPanel">
            <span id="userAvatarInitial" class="avatar-fallback">?</span>
            <img id="userAvatarImage" class="avatar-image hidden" alt="صورة المستخدم" loading="lazy" />
          </button>
          <div id="userMenuPanel" class="user-menu-panel hidden" role="menu">
            <div class="user-menu-header">
              <div class="avatar-preview">
                <span id="userMenuAvatarInitial" class="avatar-fallback avatar-fallback-lg">?</span>
                <img id="userMenuAvatarImage" class="avatar-image avatar-image-lg hidden" alt="صورة الملف الشخصي" loading="lazy" />
              </div>
              <p id="userMenuEmail" class="user-menu-email">-</p>
            </div>
            <div class="user-menu-actions">
              <button id="userAvatarUploadBtn" type="button" class="btn-secondary" style="display:none">تغيير الصورة</button>
              <input id="userAvatarInput" type="file" class="hidden" accept="image/*" capture="environment" />
              <button id="logoutBtn" type="button" class="btn-danger">تسجيل الخروج</button>
            </div>
          </div>
        </div>
      </div>
      <nav class="tabs-nav" aria-label="التنقل الرئيسي">
        <a data-nav="product-editor" href="product-editor.html" aria-current="page">إضافة منتج</a>
        <a data-nav="products" href="products.html">المنتجات</a>
        <a data-nav="sales" href="sales.html">المبيعات</a>
        <a data-nav="orders" href="orders.html">الطلبات</a>
        <a data-nav="account" href="account.html">الحساب</a>
      </nav>
    </div>
  </header>
  <main class="page-wrap stack">
    <p id="productsStatus" class="status-note hidden" aria-live="polite"></p>

    <div class="pe-card">
      <div class="card-title"><i class="fa-solid fa-cube"></i> بيانات المنتج</div>
      <form id="productForm" novalidate>
        <div class="pe-grid">
          <div class="pe-field">
            <label for="productName">اسم المنتج</label>
            <input id="productName" type="text" class="pe-input" required autocomplete="off" />
          </div>
          <div class="pe-field">
            <label for="productCategory">القسم</label>
            <select id="productCategory" class="pe-input" required style="appearance:auto;">
              <option value="">اختر القسم</option>
              <option value="إلكترونيات">إلكترونيات</option>
              <option value="موبايلات وملحقاتها">موبايلات وملحقاتها</option>
              <option value="ملابس وأحذية">ملابس وأحذية</option>
              <option value="تجميل وعناية">تجميل وعناية</option>
              <option value="عطور">عطور</option>
              <option value="منتجات رياضية">منتجات رياضية</option>
              <option value="منزل ومطبخ">منزل ومطبخ</option>
              <option value="مستلزمات المنزل">مستلزمات المنزل</option>
              <option value="مكتب ودراسة">مكتب ودراسة</option>
              <option value="ساعات">ساعات</option>
              <option value="حفاضات وأطفال">حفاضات وأطفال</option>
              <option value="ألعاب">ألعاب</option>
              <option value="كتب ومجلات">كتب ومجلات</option>
              <option value="حيوانات أليفة">حيوانات أليفة</option>
              <option value="سيارات">سيارات</option>
              <option value="مجوهرات وإكسسوارات">مجوهرات وإكسسوارات</option>
              <option value="كاميرات وتصوير">كاميرات وتصوير</option>
              <option value="سماعات">سماعات</option>
              <option value="هدايا">هدايا</option>
            </select>
          </div>
        </div>
        <div class="pe-grid">
          <div class="pe-field">
            <label for="productPrice">السعر</label>
            <input id="productPrice" type="number" min="0" step="0.01" class="pe-input" required inputmode="decimal" />
          </div>
          <div class="pe-field">
            <label for="productDiscount">نسبة الخصم %</label>
            <input id="productDiscount" type="number" min="0" max="100" value="0" class="pe-input" inputmode="numeric" />
          </div>
        </div>
        <div class="pe-grid">
          <div class="pe-field">
            <label for="productQuantity">الكمية</label>
            <input id="productQuantity" type="number" min="0" value="1" class="pe-input" required inputmode="numeric" />
          </div>
          <div class="pe-field">
            <label for="productPhone">رقم هاتف التواصل</label>
            <input id="productPhone" type="tel" class="pe-input" autocomplete="tel" inputmode="tel" />
          </div>
        </div>
        <div class="pe-field">
          <label for="productDescription">الوصف</label>
          <textarea id="productDescription" rows="4" class="pe-input" required autocomplete="off"></textarea>
        </div>
        <div class="pe-actions" style="margin-top:4px;">
          <button id="submitProductBtn" type="submit" class="btn-pe"><i class="fa-regular fa-floppy-disk"></i> حفظ المنتج</button>
          <a id="cancelEditLink" class="btn-pe-secondary hidden" href="products.html"><i class="fa-solid fa-xmark"></i> إلغاء التعديل</a>
        </div>
      </form>
    </div>

    <div class="pe-card">
      <div class="card-title"><i class="fa-solid fa-images"></i> صور المنتج (حتى 8 صور)</div>
      <div class="pe-upload-zone" id="imageUploadZone">
        <input id="productImageInput" type="file" accept="image/*" multiple hidden />
        <div id="imageUploadPlaceholder">
          <div class="uz-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
          <p class="uz-title">اضغط أو اسحب الصور هنا</p>
          <p class="uz-hint">JPG, PNG - حتى 8 صور</p>
        </div>
      </div>
      <div id="imagePreviewGrid" class="editor-upload-preview-grid"></div>
    </div>

    <div class="pe-card">
      <div class="card-title"><i class="fa-solid fa-video"></i> فيديو المنتج <span style="font-weight:400;color:#94a3b8;">(اختياري)</span></div>
      <div class="pe-upload-zone" id="videoUploadZone" style="padding:16px;">
        <input id="productVideoInput" type="file" accept="video/*" hidden />
        <div id="videoUploadPlaceholder">
          <div class="uz-icon"><i class="fa-solid fa-video"></i></div>
          <p class="uz-title" id="videoUploadText">اضغط لاختيار فيديو من المعرض</p>
        </div>
      </div>
      <div id="videoPreviewBox" class="hidden" style="margin-top:10px;">
        <video id="videoPreview" controls style="max-width:100%;max-height:200px;border-radius:12px;"></video>
        <button id="removeVideoBtn" type="button" style="margin-top:6px;padding:8px 20px;border:none;border-radius:10px;background:#ef4444;color:#fff;font-weight:700;font-size:0.85rem;cursor:pointer;"><i class="fa-solid fa-trash-can"></i> إزالة الفيديو</button>
      </div>
    </div>
  </main>
  <script src="../js/supabase.js"></script>
  <script src="../assets/js/config.js?v=20260326-1"></script>
  <script src="../assets/js/security-utils.js?v=20260324-4"></script>
  <script src="../assets/js/supabase-service.js?v=20260712-20"></script>
  <script src="../assets/js/session.js?v=20260712-1"></script>
  <script src="../assets/js/dashboard-topbar-menu.js?v=20260325-3"></script>
  <script src="../assets/js/dashboard-product-editor.js?v=20260712-3"></script>
</body>
</html>
